services:
  roundup-backend:
    build: ./backend
    image: roundup-backend:latest
    pull_policy: never
    container_name: roundup-backend
    restart: unless-stopped
    environment:
      - TZ=America/Detroit
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    volumes:
      - /mnt/user/appdata/roundup/data:/data

  roundup-frontend:
    build: ./frontend
    image: roundup-frontend:latest
    pull_policy: never
    container_name: roundup-frontend
    restart: unless-stopped
    depends_on:
      - roundup-backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - default
      - infra_default

networks:
  infra_default:
    external: true
