server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never let the browser/proxy cache the app shell HTML, so updates ship immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API — proxied to the backend container. SSE-friendly (no buffering, long read timeout).
    location /api/ {
        proxy_pass http://roundup-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
    }

    # Auth routes — proxied to the backend container.
    location /auth/ {
        proxy_pass http://roundup-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
